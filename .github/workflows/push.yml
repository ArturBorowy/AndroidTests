name: run tests (only debug)
run-name: PUSH workflow

on:
  push:
    branches:
      - master
      - develop

jobs:
  runTests:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Checkout
        uses: actions/checkout@v4

      - name: testDebugUnitTest
        run: bash ./gradlew testDebugUnitTest